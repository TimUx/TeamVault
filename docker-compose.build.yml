# Optional overlay: build the image locally instead of pulling GHCR.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Or set TEAMVAULT_IMAGE=teamvault:local and use the install script with TEAMVAULT_BUILD=1.

services:
  teamvault:
    image: ${TEAMVAULT_IMAGE:-teamvault:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
