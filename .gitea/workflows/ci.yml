# TeamVault CI — Gitea Actions (ubuntu runner)
#
# Prerequisites on the instance:
#   - Act-Runner with label "ubuntu-latest" (or change runs-on below)
#   - Container registry / Packages enabled
# Optional repo secrets/vars:
#   - secrets.REGISTRY_TOKEN  — PAT with write:package (fallback: gitea.token)
#   - secrets.ACT_RUN_TOKEN   — token for internal git clone (fallback: gitea.token)
#   - vars.REGISTRY           — registry host (default: hostname of gitea.server_url)
#   - vars.GOPROXY / vars.GOSUMDB — corp module proxy if needed
#   - vars.HTTP_PROXY / HTTPS_PROXY / NO_PROXY — corp HTTP proxy (defaults: proxyits)
#
# Note: Do not use actions/checkout or actions/setup-go from github.com — act clones
# those before workflow env is applied. Checkout via internal Gitea (storage-dashboard
# pattern); Go via docker.io/library/golang with HTTP(S)_PROXY.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

env:
  GOPROXY: ${{ vars.GOPROXY || 'https://proxy.golang.org,direct' }}
  GOSUMDB: ${{ vars.GOSUMDB || 'sum.golang.org' }}
  CGO_ENABLED: "0"
  HTTP_PROXY: ${{ vars.HTTP_PROXY || 'http://proxy.example.internal:8080' }}
  HTTPS_PROXY: ${{ vars.HTTPS_PROXY || 'http://proxy.example.internal:8080' }}
  NO_PROXY: ${{ vars.NO_PROXY || 'localhost,127.0.0.1,gitea,git.example.internal,.example.internal' }}
  http_proxy: ${{ vars.HTTP_PROXY || 'http://proxy.example.internal:8080' }}
  https_proxy: ${{ vars.HTTPS_PROXY || 'http://proxy.example.internal:8080' }}
  no_proxy: ${{ vars.NO_PROXY || 'localhost,127.0.0.1,gitea,git.example.internal,.example.internal' }}
  GO_IMAGE: golang:1.23.3-bookworm

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        env:
          ACT_TOKEN: ${{ secrets.ACT_RUN_TOKEN || gitea.token }}
        run: |
          set -euo pipefail
          # Internal clone (docker-apps network), same approach as storage-dashboard CI logs
          git clone --no-checkout "http://oauth2:${ACT_TOKEN}@gitea:3000/${{ gitea.repository }}.git" .
          git checkout --force "${{ gitea.sha }}"
          test -f go.mod

      - name: Go test / vet / smoke (via golang image)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${GO_IMAGE}"
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e GOPROXY -e GOSUMDB -e CGO_ENABLED \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
            -e http_proxy -e https_proxy -e no_proxy \
            "${GO_IMAGE}" \
            bash -c '
              set -euo pipefail
              go test ./...
              h1=$(sha256sum web/static/cryptocore.js | awk "{print \$1}")
              h2=$(sha256sum clients/js/cryptocore.js | awk "{print \$1}")
              h3=$(sha256sum clients/extension/cryptocore.js | awk "{print \$1}")
              if [ "$h1" != "$h2" ] || [ "$h1" != "$h3" ]; then
                echo "cryptocore.js mismatch — keep web/static, clients/js, clients/extension in sync"
                exit 1
              fi
              echo "cryptocore.js ok ($h1)"
              go vet ./...
              go install golang.org/x/vuln/cmd/govulncheck@latest
              govulncheck ./...
              VER="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
              COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo none)"
              LDFLAGS="-s -w -X github.com/teamvault/teamvault/internal/buildinfo.Version=${VER} -X github.com/teamvault/teamvault/internal/buildinfo.Commit=${COMMIT}"
              go build -trimpath -ldflags="${LDFLAGS}" -o /tmp/teamvault ./cmd/teamvault
              go build -trimpath -o /tmp/tvcli ./cmd/tvcli
              /tmp/teamvault -version
              /tmp/tvcli version
            '

  docker:
    name: Docker package
    needs: test
    if: >-
      gitea.event_name == 'workflow_dispatch' ||
      (gitea.event_name == 'push' &&
        (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        env:
          ACT_TOKEN: ${{ secrets.ACT_RUN_TOKEN || gitea.token }}
        run: |
          set -euo pipefail
          git clone --no-checkout "http://oauth2:${ACT_TOKEN}@gitea:3000/${{ gitea.repository }}.git" .
          git checkout --force "${{ gitea.sha }}"
          test -f go.mod

      - name: Resolve registry and image names
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ vars.REGISTRY }}" ]; then
            REGISTRY="${{ vars.REGISTRY }}"
          else
            REGISTRY="$(echo '${{ gitea.server_url }}' | sed -E 's#^https?://##' | cut -d/ -f1)"
          fi
          REPO_LC="$(echo '${{ gitea.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${REPO_LC}"

          SHA_SHORT="$(echo '${{ gitea.sha }}' | cut -c1-7)"
          TAGS=("${IMAGE}:sha-${SHA_SHORT}")

          if [ '${{ gitea.ref }}' = 'refs/heads/main' ]; then
            TAGS+=("${IMAGE}:latest" "${IMAGE}:main")
          fi
          if [[ '${{ gitea.ref }}' == refs/tags/v* ]]; then
            VER='${{ gitea.ref_name }}'
            TAGS+=("${IMAGE}:${VER}" "${IMAGE}:${VER#v}")
          fi

          {
            echo "registry=${REGISTRY}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Registry: ${REGISTRY}"
          echo "Image:    ${IMAGE}"
          echo "Tags:"
          printf '  - %s\n' "${TAGS[@]}"

      - name: Login to Gitea container registry
        shell: bash
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          REGISTRY_USER: ${{ gitea.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || gitea.token }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_TOKEN}" ]; then
            echo "Missing registry token (set secrets.REGISTRY_TOKEN or ensure gitea.token is available)" >&2
            exit 1
          fi
          echo "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin

      - name: Build image
        shell: bash
        env:
          GOPROXY: ${{ env.GOPROXY }}
          GOSUMDB: ${{ env.GOSUMDB }}
          HTTP_PROXY: ${{ env.HTTP_PROXY }}
          HTTPS_PROXY: ${{ env.HTTPS_PROXY }}
          NO_PROXY: ${{ env.NO_PROXY }}
        run: |
          set -euo pipefail
          PRIMARY="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          VER="$(git describe --tags --always --dirty 2>/dev/null || echo '${{ gitea.sha }}' | cut -c1-7)"
          COMMIT="$(echo '${{ gitea.sha }}' | cut -c1-7)"
          docker build \
            --build-arg "HTTP_PROXY=${HTTP_PROXY}" \
            --build-arg "HTTPS_PROXY=${HTTPS_PROXY}" \
            --build-arg "http_proxy=${HTTP_PROXY}" \
            --build-arg "https_proxy=${HTTPS_PROXY}" \
            --build-arg "NO_PROXY=${NO_PROXY}" \
            --build-arg "no_proxy=${NO_PROXY}" \
            --build-arg "GOPROXY=${GOPROXY}" \
            --build-arg "GOSUMDB=${GOSUMDB}" \
            --build-arg "VERSION=${VER}" \
            --build-arg "COMMIT=${COMMIT}" \
            -t "${PRIMARY}" \
            -f Dockerfile \
            .
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker tag "${PRIMARY}" "${tag}"
          done <<< '${{ steps.meta.outputs.tags }}'

      - name: Container image scan (Trivy)
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
            -e http_proxy -e https_proxy -e no_proxy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "${PRIMARY}"

      - name: Push package
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            echo "Pushing ${tag}"
            docker push "${tag}"
          done <<< '${{ steps.meta.outputs.tags }}'

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### TeamVault container package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull example:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull ${{ steps.meta.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
