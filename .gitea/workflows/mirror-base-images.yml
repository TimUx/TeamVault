# One-shot / on-demand: mirror public base images into the Gitea container registry
# so TeamVault CI never needs Docker Hub / gcr.io / aquasec through the corp proxy.
#
# Trigger: Actions → "Mirror base images" → Run workflow
# Requires: secrets.REGISTRY_TOKEN (or gitea.token) with write:package

name: Mirror base images

on:
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY || 'git.example.internal' }}
  OWNER: cc-3.3
  HTTP_PROXY: ${{ vars.HTTP_PROXY || 'http://proxy.example.internal:8080' }}
  HTTPS_PROXY: ${{ vars.HTTPS_PROXY || 'http://proxy.example.internal:8080' }}
  NO_PROXY: ${{ vars.NO_PROXY || 'localhost,127.0.0.1,gitea,git.example.internal,.example.internal' }}
  http_proxy: ${{ vars.HTTP_PROXY || 'http://proxy.example.internal:8080' }}
  https_proxy: ${{ vars.HTTPS_PROXY || 'http://proxy.example.internal:8080' }}
  no_proxy: ${{ vars.NO_PROXY || 'localhost,127.0.0.1,gitea,git.example.internal,.example.internal' }}

jobs:
  mirror:
    name: Mirror
    runs-on: ubuntu-latest
    steps:
      - name: Login to Gitea registry
        shell: bash
        env:
          REGISTRY_USER: ${{ gitea.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || gitea.token }}
        run: |
          set -euo pipefail
          echo "${REGISTRY_TOKEN}" | docker login "${REGISTRY}" -u "${REGISTRY_USER}" --password-stdin

      - name: Pull, retag, push base images
        shell: bash
        run: |
          set -euo pipefail
          mirror() {
            local src="$1" dest="$2"
            echo "=== ${src} -> ${dest} ==="
            docker pull "${src}"
            docker tag "${src}" "${dest}"
            docker push "${dest}"
          }
          mirror "golang:1.23.3-bookworm" \
            "${REGISTRY}/${OWNER}/golang:1.23.3-bookworm"
          mirror "gcr.io/distroless/static-debian12:nonroot" \
            "${REGISTRY}/${OWNER}/distroless-static:nonroot"
          mirror "aquasec/trivy:latest" \
            "${REGISTRY}/${OWNER}/trivy:latest"
          echo "Done."
