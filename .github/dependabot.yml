version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
