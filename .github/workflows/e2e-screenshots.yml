# Ephemeral test server on GitHub runner: Go tests + Playwright UI walkthrough + screenshot artifacts.
# Screenshot commits into docs/help are owned by docs.yml (avoids push races on main).
name: E2E Test & Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/static/**"
      - "internal/**"
      - "cmd/**"
      - "scripts/capture-docs-screenshots.mjs"
      - "scripts/ci/**"
      - ".github/workflows/e2e-screenshots.yml"

concurrency:
  group: e2e-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Test server, UI smoke & screenshots
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Go tests
        run: go test -mod=mod ./... -count=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Playwright OS deps
        run: npx --prefix scripts playwright install-deps chromium

      - name: Start test server & capture screenshots
        run: bash scripts/ci/docs-screenshots.sh

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: |
            docs/images/*.png
            web/static/help/img/*.png
          if-no-files-found: error
          retention-days: 14
