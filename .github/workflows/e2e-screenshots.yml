# Ephemeral test server on GitHub runner: Go tests + Playwright UI walkthrough + doc screenshots.
name: E2E Test & Screenshots

on:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: Screenshot-Updates nach main committen
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "web/static/**"
      - "internal/**"
      - "cmd/**"
      - "scripts/capture-docs-screenshots.mjs"
      - "scripts/ci/**"
      - ".github/workflows/e2e-screenshots.yml"

concurrency:
  group: e2e-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  e2e:
    name: Test server, UI smoke & screenshots
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Go tests
        run: go test -mod=mod ./... -count=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Playwright OS deps
        run: npx --prefix scripts playwright install-deps chromium

      - name: Start test server & capture screenshots
        run: bash scripts/ci/docs-screenshots.sh

      - name: Commit generated assets
        id: commit
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_screenshots != 'false')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png web/static/help/img/*.png 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs: refresh screenshots from E2E runner [skip ci]" -m "Automated capture against ephemeral test server with fictional demo data."
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push screenshot updates
        if: steps.commit.outputs.committed == 'true'
        run: git push origin HEAD:main
