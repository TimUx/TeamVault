# Emergency: delete all GitHub Packages visible to this repository's GITHUB_TOKEN
# (GHCR images and any other package types linked to the repo).
name: Purge packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE-ALL-PACKAGES to confirm
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  purge:
    name: Delete packages
    if: ${{ inputs.confirm == 'DELETE-ALL-PACKAGES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete all packages this token can see
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys, urllib.parse

          def gh(*args, check=False):
              r = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", *args],
                  capture_output=True, text=True,
              )
              if check and r.returncode != 0:
                  print(r.stderr or r.stdout, file=sys.stderr)
                  raise SystemExit(r.returncode)
              return r

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          types = ["container", "npm", "maven", "rubygems", "nuget", "docker"]
          seen = set()

          def collect(path):
              r = gh("--paginate", path)
              if r.returncode != 0:
                  print(f"list skip {path}: {(r.stderr or r.stdout).strip()[:300]}")
                  return
              try:
                  data = json.loads(r.stdout) if r.stdout.strip() else []
              except json.JSONDecodeError:
                  print(f"bad json from {path}")
                  return
              if not isinstance(data, list):
                  data = [data]
              for pkg in data:
                  name = pkg.get("name")
                  ptype = pkg.get("package_type")
                  if name and ptype:
                      seen.add((ptype, name))
                      print(f"found {ptype}:{name} vis={pkg.get('visibility')} html={pkg.get('html_url')}")

          for t in types:
              collect(f"/user/packages?package_type={t}")
              collect(f"/users/{urllib.parse.quote(owner)}/packages?package_type={t}")
              collect(f"/repos/{repo}/packages?package_type={t}")

          for name in ("teamvault", "TeamVault", repo.split("/")[-1], f"{repo.split('/')[-1]}/cache"):
              seen.add(("container", name))

          def delete_pkg(ptype, name):
              enc = urllib.parse.quote(name, safe="")
              paths = [
                  f"/user/packages/{ptype}/{enc}",
                  f"/users/{urllib.parse.quote(owner)}/packages/{ptype}/{enc}",
                  f"/repos/{repo}/packages/{ptype}/{enc}",
              ]
              for base in paths:
                  vr = gh("--paginate", f"{base}/versions")
                  if vr.returncode != 0:
                      continue
                  try:
                      versions = json.loads(vr.stdout) if vr.stdout.strip() else []
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(versions, list):
                      versions = [versions]
                  for v in versions:
                      vid = v.get("id")
                      tags = ",".join((v.get("metadata") or {}).get("container", {}).get("tags") or [])
                      print(f"DELETE {base}/versions/{vid} tags={tags}")
                      d = gh("-X", "DELETE", f"{base}/versions/{vid}")
                      print(f"  -> rc={d.returncode} {(d.stderr or d.stdout).strip()[:200]}")
                  print(f"DELETE package {base}")
                  d = gh("-X", "DELETE", base)
                  print(f"  -> rc={d.returncode} {(d.stderr or d.stdout).strip()[:200]}")

          print(f"targets: {sorted(seen)}")
          for ptype, name in sorted(seen):
              delete_pkg(ptype, name)
          print("DONE")
          PY
