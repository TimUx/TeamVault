# Go tests + optional Playwright screenshots; commits PNG updates for docs/help.
# Manual: Actions → Docs & Screenshots → Run workflow
name: Docs & Screenshots

on:
  push:
    branches: [main]
    paths:
      - "web/static/**"
      - "docs/**"
      - "internal/**"
      - "cmd/**"
      - "clients/**"
      - "go.mod"
      - "go.sum"
      - "scripts/capture-docs-screenshots.mjs"
      - "scripts/ci/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      refresh_screenshots:
        description: PNG-Screenshots neu erzeugen
        type: boolean
        default: true
      force_release:
        description: Patch-Release erzwingen (nur sinnvoll bei Online-Hilfe-Änderungen)
        type: boolean
        default: false

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Tests, screenshots & docs
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve base ref
        id: base
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Classify incoming changes
        id: incoming
        run: bash scripts/ci/docs-changes.sh "${{ steps.base.outputs.before }}" "${{ steps.base.outputs.head }}"

      - name: Should refresh screenshots
        id: shots
        run: |
          REFRESH="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.refresh_screenshots }}" = "true" ]; then
            REFRESH="true"
          elif [ "${{ github.event_name }}" = "push" ] && { [ "${{ steps.incoming.outputs.ui_changed }}" = "true" ] || [ "${{ steps.incoming.outputs.help_changed }}" = "true" ]; }; then
            REFRESH="true"
          fi
          echo "refresh=$REFRESH" >> "$GITHUB_OUTPUT"

      - name: cryptocore.js checksum sync
        run: |
          set -euo pipefail
          h1=$(sha256sum web/static/cryptocore.js | awk '{print $1}')
          h2=$(sha256sum clients/js/cryptocore.js | awk '{print $1}')
          h3=$(sha256sum clients/extension/cryptocore.js | awk '{print $1}')
          if [ "$h1" != "$h2" ] || [ "$h1" != "$h3" ]; then
            echo "cryptocore.js mismatch — keep web/static, clients/js, clients/extension in sync"
            exit 1
          fi
          echo "cryptocore.js ok ($h1)"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Go tests
        run: go test -mod=mod ./... -count=1

      - name: Set up Node
        if: steps.shots.outputs.refresh == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Playwright OS deps
        if: steps.shots.outputs.refresh == 'true'
        run: npx --prefix scripts playwright install-deps chromium

      - name: Refresh screenshots
        if: steps.shots.outputs.refresh == 'true'
        run: bash scripts/ci/docs-screenshots.sh

      - name: Commit generated assets
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png web/static/help/img/*.png 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs: refresh screenshots and help images [skip ci][skip docker]" -m "Automated update from Docs & Screenshots workflow."
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Patch release when online help changed
        id: release
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          bash scripts/ci/bump-patch-tag.sh "${{ steps.base.outputs.before }}" "$HEAD"
          if [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            if git diff --name-only "${{ steps.base.outputs.before }}" "$HEAD" | grep -qE '^web/static/help/'; then
              echo "Force release flag set (help paths changed)."
            else
              echo "force_release ignored — no online help changes in diff." >&2
            fi
          fi

      - name: Push to GitHub
        if: steps.commit.outputs.committed == 'true' || steps.release.outputs.needs_release == 'true'
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          git push origin HEAD:main
          if [ "${{ steps.release.outputs.needs_release }}" = "true" ] && [ -n "${{ steps.release.outputs.new_tag }}" ]; then
            git push origin "${{ steps.release.outputs.new_tag }}"
          fi
