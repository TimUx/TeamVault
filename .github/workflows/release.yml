# Build and publish teamvault server + tvcli binaries on release tags.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  CGO_ENABLED: "0"

jobs:
  server:
    name: server (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="teamvault-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          ver="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          go build -trimpath -mod=mod \
            -ldflags="-s -w -X github.com/teamvault/teamvault/internal/buildinfo.Version=${ver} -X github.com/teamvault/teamvault/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o "dist/${name}" ./cmd/teamvault
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teamvault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/teamvault-*

  tvcli:
    name: tvcli (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="tvcli-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          ver="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          go build -trimpath -mod=mod \
            -ldflags="-s -w -X main.version=${ver} -X main.commit=${GITHUB_SHA}" \
            -o "dist/${name}" ./cmd/tvcli
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tvcli-*

  desktop-linux:
    name: desktop (linux-amd64 + AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: clients/desktop/go.sum

      - name: Install native build deps (Xvfb, WebKitGTK, GTK, AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Build portable binary + AppImage
        env:
          # Wails (webview bindings) and the systray tray icon both require
          # cgo on Linux; the workflow-wide CGO_ENABLED=0 breaks the build.
          CGO_ENABLED: "1"
        run: xvfb-run --auto-servernum ./scripts/build-desktop.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teamvault-desktop-linux-amd64
          path: dist/teamvault-desktop-*

  desktop-windows:
    name: desktop (windows-amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: clients/desktop/go.sum

      - name: Build portable exe + per-user installer
        shell: pwsh
        run: .\scripts\build-desktop.ps1 -Installer

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teamvault-desktop-windows-amd64
          path: dist/teamvault-desktop-*

  extension-stores:
    name: extension store packages (Chrome + Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install Playwright (Chromium)
        run: |
          set -euo pipefail
          npm install --prefix scripts --no-audit --no-fund
          npx --prefix scripts playwright install --with-deps chromium

      - name: Capture store screenshots (synthetic demo data only)
        run: node scripts/capture-extension-screenshots.mjs

      - name: Build Chrome + Firefox store packages
        run: node scripts/pack-extension-stores.mjs --screenshots dist/extension-store-screenshots

      - name: Verify Firefox package with web-ext lint
        run: |
          set -euo pipefail
          ver="$(node -p 'require("./clients/extension/manifest.json").version')"
          npx --yes web-ext@8 lint --source-dir "dist/teamvault-extension-firefox-${ver}.zip" --no-config-discovery

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teamvault-extension-stores
          path: dist/teamvault-extension-*.zip

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [server, tvcli, desktop-linux, desktop-windows, extension-stores]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum teamvault-* tvcli-* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign release assets
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for file in teamvault-* tvcli-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" "$file"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: .
          artifact-name: teamvault-${{ github.ref_name }}.spdx.json
          output-file: dist/teamvault-${{ github.ref_name }}.spdx.json

      - name: Attest checksums
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: dist/*

  docker:
    name: Build & publish release Docker image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [server, tvcli, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extension signing key
        id: extkey
        env:
          KEY: ${{ secrets.TV_EXTENSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          pem="${RUNNER_TEMP}/tv_extension.pem"
          : > "$pem"
          has_key=false

          if [ -z "${KEY}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::Set repository secret TV_EXTENSION_SIGNING_KEY (PKCS#8 PEM) for release image builds. Never commit the private key."
              exit 1
            fi
            echo "::warning::TV_EXTENSION_SIGNING_KEY not set — building image with ephemeral extension key (CRX ID will not match committed manifest)."
          else
            if echo "${KEY}" | base64 -d 2>/dev/null | openssl pkey -noout 2>/dev/null; then
              echo "${KEY}" | base64 -d > "$pem"
            else
              printf '%s' "${KEY}" | tr -d '\r' | sed 's/\\n/\n/g' > "$pem"
            fi

            if [ -s "$pem" ] && [ "$(tail -c1 "$pem" | wc -l)" -eq 0 ]; then
              printf '\n' >> "$pem"
            fi

            if grep -q 'BEGIN .*PRIVATE KEY' "$pem" && openssl pkey -in "$pem" -noout 2>/dev/null; then
              has_key=true
            else
              : > "$pem"
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                echo "::error::TV_EXTENSION_SIGNING_KEY is not a valid PKCS#8/PEM private key (openssl pkey failed). Fix the secret and re-run."
                exit 1
              fi
              echo "::warning::TV_EXTENSION_SIGNING_KEY is set but not a valid PEM — building with ephemeral extension key. Update the secret to a PKCS#8 private key matching clients/extension/[...]"
            fi
          fi

          echo "has_key=${has_key}" >> "$GITHUB_OUTPUT"
          echo "pem_path=${pem}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}
            REQUIRE_EXTENSION_KEY=${{ steps.extkey.outputs.has_key == 'true' && '1' || '0' }}
          secret-files: |
            tv_extension_pem=${{ steps.extkey.outputs.pem_path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
