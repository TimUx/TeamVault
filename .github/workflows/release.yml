# Build and publish teamvault server + tvcli binaries on release tags.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CGO_ENABLED: "0"

jobs:
  server:
    name: server (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="teamvault-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          ver="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          go build -trimpath -mod=mod \
            -ldflags="-s -w -X github.com/teamvault/teamvault/internal/buildinfo.Version=${ver} -X github.com/teamvault/teamvault/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o "dist/${name}" ./cmd/teamvault
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teamvault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/teamvault-*

  tvcli:
    name: tvcli (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="tvcli-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          ver="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          go build -trimpath -mod=mod \
            -ldflags="-s -w -X main.version=${ver} -X main.commit=${GITHUB_SHA}" \
            -o "dist/${name}" ./cmd/tvcli
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tvcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tvcli-*

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [server, tvcli]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum teamvault-* tvcli-* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign release assets
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for file in teamvault-* tvcli-* SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" "$file"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: .
          artifact-name: teamvault-${{ github.ref_name }}.spdx.json
          output-file: dist/teamvault-${{ github.ref_name }}.spdx.json

      - name: Attest checksums
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: |
            dist/teamvault-*
            dist/tvcli-*
            dist/SHA256SUMS
            dist/*.sig
            dist/*.pem
            dist/*.spdx.json
