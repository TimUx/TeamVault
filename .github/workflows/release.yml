# Build and publish teamvault server + tvcli binaries on release tags.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  server:
    name: server (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="teamvault-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          ver="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          go build -trimpath -mod=mod \
            -ldflags="-s -w -X github.com/teamvault/teamvault/internal/buildinfo.Version=${ver} -X github.com/teamvault/teamvault/internal/buildinfo.Commit=${GITHUB_SHA}" \
            -o "dist/${name}" ./cmd/teamvault
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: teamvault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/teamvault-*

  tvcli:
    name: tvcli (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="tvcli-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          ver="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          go build -trimpath -mod=mod \
            -ldflags="-s -w -X main.version=${ver} -X main.commit=${GITHUB_SHA}" \
            -o "dist/${name}" ./cmd/tvcli
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tvcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tvcli-*

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [server, tvcli]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/teamvault-*
            dist/tvcli-*
