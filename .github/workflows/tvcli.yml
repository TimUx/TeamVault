# Build and publish standalone tvcli binaries (CGO_ENABLED=0).
name: tvcli

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  binaries:
    name: tvcli (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          name="tvcli-${GOOS}-${GOARCH}${{ matrix.suffix }}"
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.commit=${{ github.sha }}" \
            -o "dist/${name}" ./cmd/tvcli
          ls -la "dist/${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tvcli-*

  release:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tvcli-*
