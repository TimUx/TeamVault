# Build and publish TeamVault container images to GitHub Container Registry.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cryptocore.js checksum sync
        run: |
          set -euo pipefail
          h1=$(sha256sum web/static/cryptocore.js | awk '{print $1}')
          h2=$(sha256sum clients/js/cryptocore.js | awk '{print $1}')
          h3=$(sha256sum clients/extension/cryptocore.js | awk '{print $1}')
          if [ "$h1" != "$h2" ] || [ "$h1" != "$h3" ]; then
            echo "cryptocore.js mismatch — keep web/static, clients/js, clients/extension in sync"
            exit 1
          fi
          echo "cryptocore.js ok ($h1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Go test via docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
