# Build and publish TeamVault container images to GitHub Container Registry.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (
          !contains(github.event.head_commit.message, '[skip docker]') &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cryptocore.js checksum sync
        run: |
          set -euo pipefail
          h1=$(sha256sum web/static/cryptocore.js | awk '{print $1}')
          h2=$(sha256sum clients/js/cryptocore.js | awk '{print $1}')
          h3=$(sha256sum clients/extension/cryptocore.js | awk '{print $1}')
          if [ "$h1" != "$h2" ] || [ "$h1" != "$h3" ]; then
            echo "cryptocore.js mismatch — keep web/static, clients/js, clients/extension in sync"
            exit 1
          fi
          echo "cryptocore.js ok ($h1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Go test via docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Image
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'workflow_dispatch' ||
        (
          !contains(github.event.head_commit.message, '[skip docker]') &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extension signing key
        id: extkey
        env:
          KEY: ${{ secrets.TV_EXTENSION_SIGNING_KEY }}
        run: |
          set -euo pipefail
          pem="${RUNNER_TEMP}/tv_extension.pem"
          : > "$pem"
          has_key=false

          if [ -z "${KEY}" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::Set repository secret TV_EXTENSION_SIGNING_KEY (PKCS#8 PEM) for release image builds. Never commit the private key."
              exit 1
            fi
            echo "::warning::TV_EXTENSION_SIGNING_KEY not set — building image with ephemeral extension key (CRX ID will not match committed manifest)."
          else
            # Normalize CRLF and literal "\n" sequences (common when pasting PEM into secrets UI).
            printf '%s' "$KEY" | tr -d '\r' | sed 's/\\n/\n/g' > "$pem"
            if [ -s "$pem" ] && [ "$(tail -c1 "$pem" | wc -l)" -eq 0 ]; then
              printf '\n' >> "$pem"
            fi
            if grep -q 'BEGIN .*PRIVATE KEY' "$pem" && openssl pkey -in "$pem" -noout 2>/dev/null; then
              has_key=true
            else
              : > "$pem"
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                echo "::error::TV_EXTENSION_SIGNING_KEY is not a valid PKCS#8/PEM private key (openssl pkey failed). Fix the secret and re-run."
                exit 1
              fi
              echo "::warning::TV_EXTENSION_SIGNING_KEY is set but not a valid PEM — building with ephemeral extension key. Update the secret to a PKCS#8 private key matching clients/extension/manifest.json."
            fi
          fi

          echo "has_key=${has_key}" >> "$GITHUB_OUTPUT"
          echo "pem_path=${pem}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}
            REQUIRE_EXTENSION_KEY=${{ steps.extkey.outputs.has_key == 'true' && github.event_name != 'pull_request' && '1' || '0' }}
          secret-files: |
            tv_extension_pem=${{ steps.extkey.outputs.pem_path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
