<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>TeamVault</title>
  <style>
    :root { --p: #A70240; --a: #1f66d1; --a-dark: #174ea6; --bg: #f5f7fa; --surface: #fff; --t: #1a1d21; --muted: #5b6572; --bd: #e1e8ed; --radius: 6px; }
    html[data-accent="indigo"] { --a: #6750d8; --a-dark: #513db4; }
    html[data-accent="teal"] { --a: #078a83; --a-dark: #066e69; }
    html[data-accent="graphite"] { --a: #4b6178; --a-dark: #37485a; }
    html[data-accent="rose"] { --a: #d9467a; --a-dark: #ad2355; }
    html[data-accent="amber"] { --a: #b45309; --a-dark: #92400e; }
    html[data-accent="emerald"] { --a: #059669; --a-dark: #047857; }
    body { width: 360px; margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--t); }
    header { padding: 0.75rem 1rem; background: linear-gradient(135deg, var(--a-dark), var(--a)); color: #fff; font-weight: 700; font-size: 1.1rem; }
    main { padding: 0.85rem 1rem 1.1rem; }
    label { display: block; font-weight: 600; margin: 0.55rem 0 0.25rem; }
    input[type="text"], input[type="password"], input[type="search"], input:not([type]), select {
      width: 100%; box-sizing: border-box; padding: 0.45rem 0.55rem; border: 1px solid #d1d9e0; border-radius: var(--radius); background: var(--surface); color: var(--t);
    }
    button { margin-top: 0.45rem; border: 0; border-radius: var(--radius); padding: 0.45rem 0.7rem; font-weight: 600; cursor: pointer; background: var(--a); color: #fff; }
    button:hover { filter: brightness(0.96); }
    button.ghost { background: transparent; border: 1px solid #ccc; color: var(--t); }
    .btn-with-ico { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .btn-with-ico .ico { width: 1rem; height: 1rem; flex-shrink: 0; }
    .btn-ico-only { display: inline-flex; align-items: center; justify-content: center; width: 1.9rem; height: 1.9rem; padding: 0; flex-shrink: 0; }
    .btn-ico-only .ico { width: 1rem; height: 1rem; flex-shrink: 0; }
    .err { color: var(--p); margin-top: 0.5rem; white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: 0.8rem; }
    .update { border: 1px solid var(--a); border-radius: var(--radius); padding: 0.45rem 0.55rem; margin: 0.6rem 0 0; background: #fff; }
    .update a { color: var(--a-dark); font-weight: 700; }
    .list { max-height: 280px; overflow: auto; margin-top: 0.5rem; }
    .row-item { display: flex; justify-content: space-between; gap: 0.4rem; padding: 0.4rem 0; border-bottom: 1px solid var(--bd); align-items: flex-start; }
    .title { flex: 1; min-width: 0; word-break: break-word; }
    .title small { color: #666; font-size: 0.75rem; }
    .badge { display: inline-block; margin-left: 0.25rem; padding: 0 0.3rem; border-radius: 3px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; }
    .badge.shared { background: #e8f4fc; color: #006699; }
    .badge.private { background: #eee; color: #666; }
    .actions { display: flex; flex-direction: column; gap: 0.25rem; }
    .actions button { margin-top: 0; white-space: nowrap; }
    .toolbar { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.5rem; }
    .inline { display: flex; align-items: center; gap: 0.4rem; font-weight: 500; }
  </style>
</head>
<body>
  <header>TeamVault</header>
  <main>
    <section id="cfg">
      <label>Server-URL</label>
      <input id="base" placeholder="http://127.0.0.1:8080" />
      <label>Farbdesign</label>
      <select id="accent">
        <option value="blue">Blau (Standard)</option>
        <option value="indigo">Indigo</option>
        <option value="teal">Teal</option>
        <option value="graphite">Graphit</option>
        <option value="rose">Rose</option>
        <option value="amber">Amber</option>
        <option value="emerald">Emerald</option>
      </select>
      <button id="saveBase" type="button">Speichern</button>
      <p class="update" id="update" hidden></p>
    </section>
    <section id="login">
      <label>User</label><input id="user" />
      <label>Login-Passwort</label><input id="lpw" type="password" />
      <label class="inline"><input id="rememberLogin" type="checkbox" /> Login merken (max. 90 Tage)</label>
      <label id="tenantLabel" hidden>Tenant</label>
      <select id="tenant" hidden></select>
      <button id="doLogin" type="button">Anmelden</button>
    </section>
    <section id="totpStep" hidden>
      <p class="hint">Gib den 6-stelligen Code deiner Authenticator-App ein.</p>
      <label>TOTP</label><input id="totp" inputmode="numeric" maxlength="6" />
      <button id="doTotp" type="button">Bestätigen</button>
    </section>
    <section id="unlock" hidden>
      <p class="hint" id="who"></p>
      <label>Master-Passwort</label><input id="mpw" type="password" />
      <button id="doUnlock" type="button">Vault entsperren</button>
      <button class="ghost" id="logout" type="button">Logout</button>
    </section>
    <section id="vault" hidden>
      <p class="hint" id="tabHost"></p>
      <div class="toolbar">
        <input id="filter" type="search" placeholder="Suche Titel / Domain…" />
        <label class="inline">Anzeige
          <select id="visFilter">
            <option value="all">Alle</option>
            <option value="private">Privat</option>
            <option value="shared">Geteilt</option>
          </select>
        </label>
        <label class="inline"><input id="matchHost" type="checkbox" /> Nur passende Domain</label>
        <span class="hint" id="matchHint"></span>
      </div>
      <div class="list" id="slist"></div>
      <button class="ghost" id="lock" type="button">Sperren</button>
    </section>
    <div class="err" id="err" role="alert" aria-live="assertive" hidden></div>
  </main>
  <script src="vendor/nacl-fast.min.js"></script>
  <script src="vendor/argon2.umd.min.js"></script>
  <script src="vendor/secrets.min.js"></script>
  <script src="cryptocore.js"></script>
  <script src="lib/tv-url-match.js"></script>
  <script src="lib/tv-totp.js"></script>
  <script src="popup.js"></script>
</body>
</html>
