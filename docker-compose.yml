# teamVault — self-hosted Zero-Knowledge password manager
#
# 1) Create unlock key (≥32 random bytes), never commit it:
#      openssl rand -out secrets/teamvault_unlock 48
#    or:  New-Item -ItemType Directory -Force secrets; [IO.File]::WriteAllBytes("secrets/teamvault_unlock", (1..48 | %{Get-Random -Max 256}))
#
# 2) Start:
#      docker compose up -d --build
#
# 3) Open http://127.0.0.1:8080/setup

services:
  teamvault:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Corp networks: point at a reachable module proxy, or leave default.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    image: teamvault:local
    container_name: teamvault
    ports:
      - "${TEAMVAULT_PUBLISH_PORT:-8080}:8080"
    environment:
      TEAMVAULT_ADDR: ":8080"
      TEAMVAULT_DATA_DIR: /data
      TEAMVAULT_MASTER_UNLOCK_KEY_FILE: /run/secrets/teamvault_unlock
    volumes:
      - teamvault_data:/data
      - ${TEAMVAULT_UNLOCK_KEY_HOST:-./secrets/teamvault_unlock}:/run/secrets/teamvault_unlock:ro
    restart: unless-stopped
    # Distroless has no shell; healthcheck via published HTTP from the host if needed.
    # healthcheck optional with a sidecar or compose profiles.

volumes:
  teamvault_data:
