# TeamVault — self-hosted Zero-Knowledge password manager
#
# Uses images published by CI to GHCR (push to main / tags v*):
#   ghcr.io/timux/teamvault:latest
#   ghcr.io/timux/teamvault:1.1.0   (semver from release tags)
#
# Quick start (downloads only this file + .env.example — no full repo clone):
#   curl -fsSL https://raw.githubusercontent.com/TimUx/TeamVault/main/scripts/install-docker.sh | bash
#
# Manual:
#   curl -fsSLO https://raw.githubusercontent.com/TimUx/TeamVault/main/docker-compose.yml
#   curl -fsSLO https://raw.githubusercontent.com/TimUx/TeamVault/main/.env.example
#   cp .env.example .env
#   mkdir -m 700 -p secrets && openssl rand -out secrets/teamvault_unlock 48
#   chmod 644 secrets/teamvault_unlock   # image runs as nonroot; dir stays 700
#   docker compose pull && docker compose up -d
#
# Local image build (dev): full git clone + docker-compose.build.yml
#
# Unlock key: host dir secrets/ mode 700; file must be readable by container UID
# (distroless nonroot = 65532). chmod 644 on the file is OK because the directory
# blocks other host users from traversing to it.

services:
  teamvault:
    image: ${TEAMVAULT_IMAGE:-ghcr.io/timux/teamvault:latest}
    pull_policy: ${TEAMVAULT_PULL_POLICY:-always}
    container_name: teamvault
    ports:
      - "${TEAMVAULT_PUBLISH_PORT:-8080}:8080"
    environment:
      TEAMVAULT_ADDR: ":8080"
      TEAMVAULT_DATA_DIR: /data
      TEAMVAULT_MASTER_UNLOCK_KEY_FILE: /run/secrets/teamvault_unlock
    volumes:
      - teamvault_data:/data
      - ${TEAMVAULT_UNLOCK_KEY_HOST:-./secrets/teamvault_unlock}:/run/secrets/teamvault_unlock:ro
    restart: unless-stopped

volumes:
  teamvault_data:
